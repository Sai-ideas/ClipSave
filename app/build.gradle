plugins {
    id 'com.android.application'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

android {
    namespace 'dev.local.clipvault'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.local.clipvault'
        minSdk 29
        targetSdk 35
        versionCode 17
        versionName '0.8.0'
        testInstrumentationRunner 'dev.local.clipvault.PinbaoRegression'
    }

    packaging {
        resources {
            // CommonMark artifacts include the same license.
            pickFirsts += 'META-INF/LICENSE.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-task-list-items:0.24.0'
    implementation 'org.commonmark:commonmark-ext-autolink:0.24.0'
    implementation 'org.nibor.autolink:autolink:0.11.0'
    implementation 'org.jsoup:jsoup:1.21.2'
}
